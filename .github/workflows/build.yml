name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle files
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "turk7filimo"
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2'
          }
          android {
              namespace 'ir.turk7filimo.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'ir.turk7filimo.k'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  encoding 'UTF-8'
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.12.0'
              implementation 'androidx.media3:media3-exoplayer:1.3.1'
              implementation 'androidx.media3:media3-ui:1.3.1'
          }
          EOF

      - name: Arrange project folders
        run: |
          mkdir -p src/main/java/ir/turk7filimo/app src/main/res/drawable
          mv *.java src/main/java/ir/turk7filimo/app/
          mv AndroidManifest.xml src/main/
          mv ic_launcher.png logo.png src/main/res/drawable/

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/outputs/apk/debug/*.apk turk7filimo.apk
          gh release create "v${{ github.run_number }}" turk7filimo.apk \
            --title "turk7filimk ${{ github.run_number }}" \
            --notes "Download turk7filimo.apk and install it."
